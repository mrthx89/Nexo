[package]
name = "nexo-windows-ui"
version = "0.1.1"
description = "Nexo Windows kiosk + capsule UI (Tauri v2) — Phase 3 tray/autostart/minimize"
authors = ["YH Dev"]
edition = "2021"

[lib]
name = "nexo_windows_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }

# Real backend integration boundary (Phase 1 core). Optional for now; UI works with mock.
# nexo-core = { path = "../../nexo-core", optional = true }

[features]
default = []
# real-backend = ["dep:nexo-core"]
